<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Painel — Produção VIP</title><style>*{box-sizing:border-box}body{margin:0;font:15px Arial;background:#eef3f8;color:#172033}.top{background:#0b4b85;color:white;padding:16px max(20px,calc((100vw - 1100px)/2));display:flex;justify-content:space-between;align-items:center}.top a,.top button{color:white}.wrap{max-width:1100px;margin:25px auto;padding:0 18px}.bar,.card{background:white;border:1px solid #dbe3ef;border-radius:14px;padding:18px;margin:12px 0}.bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap}button,select,input{padding:10px;border:1px solid #cbd5e1;border-radius:8px}button{background:#0969c7;color:white;font-weight:800;border:0;cursor:pointer}.stats{color:#526277}.row{border-top:1px solid #e5eaf1;padding:13px 0;display:grid;grid-template-columns:1fr auto;gap:10px}.tag{display:inline-block;background:#eaf3ff;border-radius:20px;padding:5px 9px;margin:3px;font-size:12px}.hide{display:none}.small{color:#64748b;font-size:13px}.msg{margin:10px 0;color:#0756a1}@media(max-width:600px){.row{grid-template-columns:1fr}}</style><header class="top"><b>🏭 PRODUÇÃO VIP · ACOMPANHAMENTO</b><span><a href="/">Início</a>　<button id="sair">Sair</button></span></header><main class="wrap"><section class="bar"><b id="who">Carregando conta…</b><span id="role"></span><select id="filter"><option value="">Todos os setores</option></select><button id="refresh">Atualizar</button><span class="small">Atualização automática</span></section><section class="card"><div id="msg" class="msg"></div><div id="stats" class="stats"></div><div id="items"></div></section><section id="admin" class="card hide"><h2>Administrar acessos</h2><p class="small">Convide administradores, atendentes ou um responsável com acesso a um setor. O convite chega por e-mail.</p><form id="invite" class="bar"><input id="nome" placeholder="Nome"><input id="mail" type="email" placeholder="E-mail" required><select id="role"><option value="attendant">Atendente central</option><option value="admin">Administrador</option><option value="sector_admin">Acesso de setor</option></select><select id="sector" class="hide"></select><button>Enviar convite</button></form><div id="inviteMsg" class="msg"></div><div id="users"></div></section></main><script src="/assets/pv-auth.js"></script><script>const $=s=>document.querySelector(s),safe=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));let me,sectors=[];$("#sair").onclick=()=>PVAuth.logout();$("#refresh").onclick=load;$("#role").onchange=()=>$("#sector").classList.toggle("hide",$("#role").value!=="sector_admin");async function init(){try{const r=await PVAuth.api("/api/me");me=r.user;sectors=r.sectors||[];$("#who").textContent=me.name||me.email;$("#role").textContent=me.role;const opts=sectors.map(s=>'<option value="'+safe(s.codigo)+'">'+safe(s.nome)+'</option>').join("");$("#filter").insertAdjacentHTML("beforeend",opts);$("#sector").innerHTML=opts;if(["owner","admin"].includes(me.role)){$("#admin").classList.remove("hide");users()}await load()}catch(e){$("#msg").textContent=e.message}}async function load(){try{const s=$("#filter").value;const j=await PVAuth.api("/api/demands"+(s?"?sector="+encodeURIComponent(s):""));const list=j.demands||[];$("#stats").textContent=list.length+" demanda(s)";$("#items").innerHTML=list.length?list.map(d=>{const p=d.payload||d;return '<article class="row"><div><b>'+safe(p.cliente||"Cliente")+'</b> · OS '+safe(d.os||p.os||"—")+'<div class="small">'+safe(p.pedido||p.itens?.map(x=>x.descricao||x.tipo).join(", ")||"")+'</div><div>'+((d.setores||p.setores||[]).map(x=>'<span class="tag">'+safe(typeof x==="string"?x:(sectors.find(a=>a.codigo===x)?.nome||x))+'</span>').join(""))+'</div></div><div><span class="tag">'+safe(d.status||p.status||"em produção")+'</span><div class="small">'+safe(d.updated_at?new Date(d.updated_at).toLocaleString("pt-BR"):"")+'</div></div></article>'}).join(""):"Nenhuma demanda compartilhada ainda."}catch(e){$("#msg").textContent=e.message}}async function users(){try{const j=await PVAuth.api("/api/users");$("#users").innerHTML="<h3>Contas</h3>"+(j.users||[]).map(u=>'<div class="row"><span><b>'+safe(u.display_name||u.email)+'</b><div class="small">'+safe(u.email)+'</div></span><select data-role="'+safe(u.user_id)+'"><option value="attendant">Atendente central</option><option value="admin">Administrador</option><option value="sector_admin">Acesso de setor</option><option value="pending">Bloquear</option></select><select data-sector="'+safe(u.user_id)+'">'+sectors.map(s=>'<option value="'+safe(s.codigo)+'">'+safe(s.nome)+'</option>').join("")+'</select><label><input type="checkbox" data-active="'+safe(u.user_id)+'" '+(u.active?"checked":"")+'> ativo</label><button data-save-user="'+safe(u.user_id)+'">Salvar</button></div>').join("");(j.users||[]).forEach(u=>{const id=u.user_id,r=document.querySelector('[data-role="'+id+'"]'),s=document.querySelector('[data-sector="'+id+'"]');r.value=u.role;if(u.sector_code)s.value=u.sector_code});document.querySelectorAll("[data-save-user]").forEach(btn=>btn.onclick=async()=>{const id=btn.dataset.saveUser,role=document.querySelector('[data-role="'+id+'"]').value,sector_code=document.querySelector('[data-sector="'+id+'"]').value,active=document.querySelector('[data-active="'+id+'"]').checked;try{await PVAuth.api("/api/users/"+id,{method:"PATCH",body:JSON.stringify({role,sector_code,active})});users()}catch(e){alert(e.message)}})}catch(e){}}$("#invite").onsubmit=async e=>{e.preventDefault();$("#inviteMsg").textContent="Enviando convite…";try{await PVAuth.api("/api/users",{method:"POST",body:JSON.stringify({email:$("#mail").value,nome:$("#nome").value,role:$("#role").value,sector_code:$("#sector").value})});$("#inviteMsg").textContent="Convite enviado.";e.target.reset();$("#sector").classList.add("hide");users()}catch(x){$("#inviteMsg").textContent=x.message}};init();setInterval(load,10000);</script></html>

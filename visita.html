<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Tiragem de medidas · New Print Midia</title><link rel="stylesheet" href="/assets/visit-public.css"></head><body><header><b>NEW PRINT MIDIA</b><span>Visita técnica</span></header><main><section><span class="eyebrow">TIRAGEM DE MEDIDAS</span><h1 id="title">Carregando visita…</h1><div id="info"></div><p id="message" role="status"></p></section><form id="visit" hidden><section><h2>Registro da visita</h2><label>Seu nome<input name="name" autocomplete="name" required maxlength="100"></label><h3>Medidas coletadas</h3><p>Informe a unidade de cada item. Use observações para outras dimensões.</p><div id="rows"></div><button id="add" type="button" class="secondary">Adicionar medida</button><label>Observações técnicas<textarea name="technical_notes" rows="4" maxlength="5000"></textarea></label><label>Fotos (até 12 / total 8 MB)<input id="photos" type="file" accept="image/jpeg,image/png,image/webp" multiple></label><div id="previews"></div><p id="localStatus"></p><button type="submit" id="finish">CONCLUIR VISITA</button></section></form></main><script src="/assets/visit-public.js"></script></body></html>

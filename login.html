<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrar — Produção VIP</title><style>*{box-sizing:border-box}body{margin:0;font:16px Arial;background:linear-gradient(135deg,#092b50,#0876d1);min-height:100vh;display:grid;place-items:center;color:#172033}.box{background:white;padding:30px;border-radius:20px;width:min(420px,92vw);box-shadow:0 20px 70px #00142a66}h1{margin:0 0 8px;color:#0756a1}p{color:#667085;line-height:1.5}.field{display:block;margin:15px 0;font-weight:700}input{display:block;width:100%;margin-top:7px;padding:13px;border:1px solid #cbd5e1;border-radius:10px;font-size:16px}button,a.btn{display:block;width:100%;border:0;border-radius:10px;padding:13px;background:#0969c7;color:white;font-weight:800;text-align:center;text-decoration:none;cursor:pointer;margin-top:12px}.secondary{background:#edf4fb!important;color:#0756a1!important}.msg{margin:14px 0;padding:11px;border-radius:9px;background:#eff6ff;color:#174779;min-height:20px;font-size:14px}</style><main class="box"><h1>🏭 PRODUÇÃO VIP</h1><p>Entre com e-mail e senha ou use os dados de acesso e o código gerado no painel.</p><form id="f"><label class="field">E-mail ou nome de acesso<input id="email" type="text" autocomplete="username" required></label><label class="field">Código de ativação (para contas criadas no painel)<input id="codigo" type="text" autocomplete="off" placeholder="PV-..."></label><label class="field">Senha<input id="senha" type="password" autocomplete="current-password" required></label><button>Entrar</button></form><button id="cadastro" class="secondary" type="button">Primeiro acesso do administrador principal</button><div id="msg" class="msg" aria-live="polite"></div></main><script src="/assets/pv-auth.js"></script><script>const m=document.querySelector("#msg"),f=document.querySelector("#f");f.onsubmit=async e=>{e.preventDefault();m.textContent="Entrando…";try{const login=document.querySelector("#email").value.trim(),password=document.querySelector("#senha").value,code=document.querySelector("#codigo").value.trim();if(code){const r=await fetch(PVAuth.URL+"/functions/v1/producao-vip-app/api/extension-login",{method:"POST",headers:{apikey:PVAuth.KEY,"content-type":"application/json","x-pv-client":"site"},body:JSON.stringify({login_name:login,password,activation_code:code})}),j=await r.json().catch(()=>({}));if(!r.ok||!j.session)throw Error(j.error||"Não foi possível ativar este acesso.");PVAuth.save(j.session)}else await PVAuth.auth("token?grant_type=password",{email:login,password});location.href="/painel.html"}catch(x){m.textContent=x.message}};cadastro.onclick=async()=>{if(!["newprint.ap@gmail.com","walansanches71@gmail.com"].includes(email.value.trim().toLowerCase())){m.textContent="O primeiro cadastro é exclusivo dos administradores principais autorizados.";return}if(senha.value.length<8){m.textContent="Crie uma senha com pelo menos 8 caracteres.";return}m.textContent="Criando acesso…";try{const result=await PVAuth.auth("signup",{email:email.value.trim(),password:senha.value,options:{emailRedirectTo:location.origin+"/login.html"}});if(result.access_token)location.href="/painel.html";else m.textContent="Conta criada. Se a confirmação de e-mail ainda estiver ativa, confirme a mensagem recebida para entrar."}catch(x){m.textContent=x.message}};if(PVAuth.get()?.access_token)location.href="/painel.html";</script></html>

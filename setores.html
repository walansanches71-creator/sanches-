<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Setores — Produção VIP</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#eef3f8;color:#172033}.w{max-width:1050px;margin:auto;padding:25px}.hero,.card,.s{background:#fff;border:1px solid #dbe3ef;border-radius:18px;padding:20px;margin-bottom:15px}.hero{background:linear-gradient(135deg,#0969c7,#173f70);color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:13px}.s{margin:0}.badge{display:inline-block;background:#eaf3ff;color:#0756a1;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:800}</style></head><body><main class="w"><section class="hero"><h1>🏭 Central de Setores</h1><p>Setores conectados à Produção VIP.</p></section><section class="card"><div id="grid">Carregando...</div></section><section class="card"><h2>🧩 Extensões</h2><div id="ext">Carregando...</div></section></main><script>const API='https://ugqxcarzyjmybyrpdrqx.supabase.co/functions/v1/producao-vip';const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));async function load(){try{let a=await fetch(API+'/api/sectors'),j=await a.json();grid.innerHTML=j.setores.map(x=>'<div class="s"><h3>🏭 '+esc(x.nome)+'</h3><p>'+esc(x.descricao||'')+'</p><span class="badge">'+esc(x.codigo)+'</span></div>').join('');let b=await fetch(API+'/api/extensions'),e=await b.json();ext.innerHTML=e.extensoes.map(x=>'<div class="s"><b>'+esc(x.nome)+'</b><br>Setor: '+esc(x.setor_codigo)+'<br><span class="badge">'+esc(x.codigo)+'</span></div>').join('')}catch(e){grid.textContent=e.message}}load();setInterval(load,10000)</script></body></html>

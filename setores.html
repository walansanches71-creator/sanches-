<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Produção VIP · Setores</title><style>*{box-sizing:border-box}body{margin:0;font:15px Arial;background:#eef3f8;color:#172033}.bar{background:#0b4b85;color:white;padding:16px max(15px,calc((100vw - 1180px)/2));display:flex;justify-content:space-between}.wrap{max-width:1180px;margin:20px auto;padding:0 15px}.card{background:white;border:1px solid #dbe3ef;border-radius:14px;padding:18px;margin:12px 0}.actions{display:flex;gap:9px;flex-wrap:wrap;align-items:center}button,select{padding:10px;border:0;border-radius:8px}button{background:#0969c7;color:white;font-weight:800;cursor:pointer}.msg,.small{color:#64748b;font-size:13px}.item{border:1px solid #dbe3ef;border-radius:13px;padding:18px;margin:12px 0}.head{display:flex;justify-content:space-between;gap:10px}.item h2{margin:0 0 6px}.item h3{color:#0756a1;font-size:14px;margin:16px 0 5px}.detail{padding:4px 0;line-height:1.45}.tag{display:inline-block;background:#eaf3ff;color:#0756a1;border-radius:20px;padding:7px 10px;font-weight:800}.img{max-width:260px;max-height:220px;object-fit:contain;border-radius:8px;margin:5px}.hide{display:none}.tv{background:#07111d;color:white;min-height:100vh}.tv .card,.tv .item{background:#112034;border-color:#2a4564}.tv .item{font-size:19px;padding:25px}.tv h2{font-size:30px}.tv .small,.tv .msg{color:#c4d1df}.tv .detail{font-size:18px}.tv .tag{font-size:19px}@media(max-width:600px){.head{display:block}}</style><header class="bar"><b>🏭 Produção VIP · Acompanhamento de Setores</b><span id="who"></span></header><main class="wrap"><section class="card"><div class="actions"><label>Setor atual <select id="sector"></select></label><button id="tv">📺 Abrir TV deste setor</button><a href="/painel.html" style="color:#0756a1">Painel geral</a><button id="exit">Sair</button></div><p id="msg" class="msg">Carregando demandas ao vivo…</p></section><section class="card"><div id="items"></div></section></main><script src="/assets/pv-auth.js"></script><script>const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));let me,sectors=[],tv=new URLSearchParams(location.search).has("tv"),busy=false;const labels={producao:"Em produção",impressao:"Na impressão",acabamento:"No acabamento",corte:"Em corte",laser:"Corte a laser",costura:"Costura",estamparia:"Estamparia",calandra:"Calandra",material:"Aguardando material",pronto:"Pronto",entregue:"Entregue",cancelado:"Cancelado"};function sn(c){return sectors.find(s=>s.codigo===c)?.nome||c||"—"}function card(d){const p=d.payload||d,items=p.itens||[],images=Array.isArray(p.imagensPedido)&&p.imagensPedido.length?p.imagensPedido:(p.imagemPedido?[p.imagemPedido]:[]),address=p.endereco&&typeof p.endereco==="object"?Object.values(p.endereco).filter(Boolean).join(", "):p.endereco||"",history=d.historicoSetores||p.historicoSetores||[],info=[p.telefone?"📞 "+p.telefone:"",address?"📍 "+address:"",p.prazo?"📅 Prazo: "+p.prazo:"",p.horaMarcada?"⏰ "+p.horaMarcada:"",p.prioridade?"⚡ "+p.prioridade:"",p.retirada?"🚚 "+p.retirada:"",p.pagamentoStatus?"💳 "+p.pagamentoStatus+(p.pagamentoForma?" · "+p.pagamentoForma:""):"",p.pagamentoDetalhes||"",p.observacoes?"📝 "+p.observacoes:""].filter(Boolean);return '<article class="item"><div class="head"><div><h2>'+esc(p.cliente||"Cliente")+'</h2><b>OS '+esc(d.os||p.os||"—")+'</b> · '+esc(p.pedido||p.tipoProduto||"Demanda")+'</div><span class="tag">'+esc(labels[d.status||p.status]||d.status||p.status||"Em produção")+'</span></div><div class="detail">📦 '+esc(p.quantidade||items.reduce((n,x)=>n+(Number(x.quantidade)||0),0)||1)+' unidade(s) '+items.map(x=>' · '+esc(x.quantidade||1)+'× '+esc(x.descricao||x.tipo||"Item")).join("")+'</div>'+ (info.length?'<h3>Detalhes</h3>'+info.map(x=>'<div class="detail">'+esc(x)+'</div>').join(""):"")+(images.length?'<h3>Referências enviadas</h3>'+images.map(x=>/^data:image\//i.test(x)?'<img class="img" src="'+esc(x)+'">':"").join(""):"")+(history.length?'<h3>Etapas e encaminhamentos</h3>'+history.map(h=>'<div class="detail">'+esc(sn(h.from))+' · '+esc(labels[h.status]||h.status)+' '+(h.to?"→ "+esc(sn(h.to)):h.finished?"· fluxo finalizado":"")+' · '+esc(h.at?new Date(h.at).toLocaleString("pt-BR"):"")+'</div>').join(""):"")+'<div class="detail">🏭 Setor que está com a demanda: <b>'+esc(sn(d.current_sector))+'</b></div><div class="small">Atualizado '+esc(d.updated_at?new Date(d.updated_at).toLocaleString("pt-BR"):"—")+'</div></article>'}async function start(){try{const j=await PVAuth.api("/api/me");me=j.user;sectors=j.sectors||[];$("#who").textContent=me.name||me.email;let allowed=me.role==="sector_admin"?sectors.filter(s=>s.codigo===me.sector_code):sectors;if(!allowed.length)throw Error("Nenhum setor está associado a esta conta.");$("#sector").innerHTML=allowed.map(s=>'<option value="'+esc(s.codigo)+'">'+esc(s.nome)+'</option>').join("");if(me.role==="sector_admin")$("#sector").value=me.sector_code;if(tv){document.body.classList.add("tv");$("#tv").classList.add("hide")}$("#sector").onchange=load;$("#tv").onclick=()=>location.href="/setores.html?tv=1&sector="+encodeURIComponent($("#sector").value);$("#exit").onclick=()=>PVAuth.logout();if(tv&&new URLSearchParams(location.search).has("sector"))$("#sector").value=new URLSearchParams(location.search).get("sector");await load()}catch(e){$("#msg").textContent=e.message;if(!PVAuth.get()?.access_token)setTimeout(()=>location.href="/login.html",800)}}async function load(){if(busy)return;busy=true;try{const code=$("#sector").value,j=await PVAuth.api("/api/demands"+(code?"?sector="+encodeURIComponent(code):""));$("#msg").textContent=(j.demands||[]).length+" demanda(s) ativa(s) neste setor · sincronização automática";$("#items").innerHTML=(j.demands||[]).map(card).join("")||"Nenhuma demanda ativa para este setor."}catch(e){$("#msg").textContent=e.message}finally{busy=false}}start();setInterval(()=>{if($("#sector").value)load()},5000);</script></html>

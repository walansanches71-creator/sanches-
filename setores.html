<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Setor de Produção VIP</title><style>*{box-sizing:border-box}body{margin:0;font:15px Arial;background:#eef3f8;color:#172033}.top{padding:16px;background:#0b4b85;color:white;display:flex;justify-content:space-between}.wrap{max-width:1100px;margin:22px auto;padding:0 15px}.card{background:white;border:1px solid #dbe3ef;border-radius:14px;padding:17px;margin:12px 0}.row{display:flex;justify-content:space-between;gap:10px;padding:14px 0;border-top:1px solid #e5eaf1}.tag{background:#eaf3ff;border-radius:16px;padding:5px 9px}.small{color:#667085;font-size:13px}button,select{padding:9px;border:0;border-radius:8px}button{background:#0969c7;color:white;font-weight:800;cursor:pointer}.hide{display:none}@media(max-width:600px){.row{display:block}}</style><header class="top"><b>🏭 Produção VIP · Setores</b><span id="user"></span></header><main class="wrap"><section class="card"><h1 id="title">Acesso ao setor</h1><p class="small" id="help">Carregando conta e setores…</p><select id="pick"></select> <button id="tv">📺 Modo TV</button> <button id="exit">Sair</button><div id="items"></div></section></main><script src="/assets/pv-auth.js"></script><script>const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));let me,sectors=[],tv=new URLSearchParams(location.search).has("tv");const status=[["producao","Em produção"],["impressao","Na impressão"],["acabamento","No acabamento"],["corte","Em corte"],["laser","No corte a laser"],["costura","Na costura"],["estamparia","Na estamparia"],["calandra","Na calandra"],["material","Aguardando material"],["pronto","Pronto"],["entregue","Entregue"],["cancelado","Cancelado"]];$("#exit").onclick=()=>PVAuth.logout();$("#tv").onclick=()=>{const u=new URL(location.href);u.searchParams.set("tv","1");location.href=u.href};async function start(){try{const j=await PVAuth.api("/api/me");me=j.user;sectors=j.sectors||[];$("#user").textContent=esc(me.name||me.email);let allowed=me.role==="sector_admin"?sectors.filter(s=>s.codigo===me.sector_code):sectors;$("#pick").innerHTML=allowed.map(s=>'<option value="'+esc(s.codigo)+'">'+esc(s.nome)+'</option>').join("");if(!allowed.length)throw Error("Nenhum setor foi associado a esta conta. Peça ao administrador para liberar o acesso.");if(tv){document.body.style.background="#07111d";document.body.style.color="#fff";$(".card").style.background="#111e2d";$("#tv").classList.add("hide")}$("#pick").onchange=load;await load()}catch(e){$("#help").textContent=e.message;if(!PVAuth.get()?.access_token)setTimeout(()=>location.href="/login.html",1000)}}async function load(){try{const code=$("#pick").value,j=await PVAuth.api("/api/demands?sector="+encodeURIComponent(code));$("#title").textContent=(sectors.find(s=>s.codigo===code)?.nome||"Setor")+" · "+(tv?"MODO TV":"DEMANDAS");$("#help").textContent=(j.demands||[]).length+" demanda(s) · atualização automática";$("#items").innerHTML=(j.demands||[]).map(d=>{let p=d.payload||d;return '<article class="row"><div><b>'+esc(p.cliente||"Cliente")+'</b> · OS '+esc(d.os||p.os||"—")+'<div class="small">'+esc(p.pedido||p.itens?.map(x=>x.descricao||x.tipo).join(", ")||"")+'</div><div>'+((d.setores||p.setores||[]).map(s=>'<span class="tag">'+esc(typeof s==="string"?(sectors.find(x=>x.codigo===s)?.nome||s):s)+'</span>').join(""))+'</div></div><div><span class="tag">'+esc(d.status||p.status||"em produção")+'</span>'+(me.role==="sector_admin"&&!tv?'<br><select data-status="'+esc(d.id)+'">'+status.map(s=>'<option value="'+s[0]+'" '+(s[0]===(d.status||p.status)?"selected":"")+'>'+s[1]+'</option>').join("")+'</select> <button data-save="'+esc(d.id)+'">Salvar status</button>':"")+'</div></article>'}).join("")||"Nenhuma demanda para este setor.";document.querySelectorAll("[data-save]").forEach(b=>b.onclick=async()=>{let id=b.dataset.save,s=document.querySelector('[data-status="'+CSS.escape(id)+'"]').value;try{await PVAuth.api("/api/demands/"+encodeURIComponent(id)+"/status",{method:"PATCH",body:JSON.stringify({status:s,sector_code:code})});await load()}catch(e){alert(e.message)}})}catch(e){$("#help").textContent=e.message}}start();setInterval(()=>{if($("#pick").value)load()},5000);</script></html>

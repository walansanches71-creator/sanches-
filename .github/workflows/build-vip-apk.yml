name: Build VIP Camisas APK
permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    paths:
      - 'vip-apk/**'
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vip-apk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: VIP-Camisas-debug
          path: vip-apk/app/build/outputs/apk/debug/app-debug.apk

      - name: Save APK to repository
        run: |
          mkdir -p ../builds
          cp app/build/outputs/apk/debug/app-debug.apk ../builds/VIP-Camisas-v2-debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ../builds/VIP-Camisas-v2-debug.apk
          git diff --cached --quiet || git commit -m "build: publish VIP Camisas APK"
          git push

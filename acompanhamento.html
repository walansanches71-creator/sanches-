<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Acompanhamento da produção</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#172033;font-family:Arial,sans-serif}.wrap{max-width:680px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #dbe3ef;border-radius:18px;padding:20px;box-shadow:0 8px 28px #0001}.brand{font-size:14px;font-weight:800;color:#64748b}.os{font-size:30px;font-weight:900;margin:8px 0 18px}.status{padding:14px;border-radius:12px;background:#eef6ff;color:#174ea6;font-size:20px;font-weight:900;text-align:center}.status.late{background:#fee2e2;color:#b42318;border:1px solid #f2a7a0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.item{background:#f8fafc;border:1px solid #e5eaf1;border-radius:11px;padding:12px}.item small{display:block;text-transform:uppercase;color:#64748b;font-size:10px;font-weight:800;margin-bottom:5px}.item b{display:block;font-size:14px;overflow-wrap:anywhere}.item.late{background:#fff1f0;border-color:#f4aaa5}.item.late b,.item.late small{color:#b42318}.section{margin-top:16px}.section h3{margin:0 0 8px;font-size:14px}.produto{padding:10px 12px;background:#fff;border:1px solid #e5eaf1;border-radius:10px;margin-top:7px}.alert{margin-top:14px;padding:12px;border-radius:10px;background:#fee2e2;color:#b42318;font-weight:800}.ok{margin-top:14px;color:#64748b;font-size:11px;text-align:center}.erro{color:#b91c1c;font-weight:700;text-align:center;padding:30px 5px}@media(max-width:500px){.grid{grid-template-columns:1fr}.os{font-size:26px}}</style></head>
<body><main class="wrap"><div class="card" id="app">Carregando acompanhamento...</div></main>
<script>
const token=new URLSearchParams(location.search).get('token'),app=document.getElementById('app');
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function parsedDate(v){if(!v)return null;let m=String(v).match(/^(\d{2})\/(\d{2})\/(\d{4})$/);if(m)return new Date(+m[3],+m[2]-1,+m[1]);m=String(v).match(/^(\d{4})-(\d{2})-(\d{2})/);return m?new Date(+m[1],+m[2]-1,+m[3]):null}
function fmt(v){if(!v)return '—';const d=parsedDate(v);return d?d.toLocaleDateString('pt-BR'):String(v)}
function render(p){const itens=Array.isArray(p.itens)?p.itens:[],deadline=parsedDate(p.prazo),today=new Date();today.setHours(0,0,0,0);const closed=['PRONTO','ENTREGUE','CANCELADO'].includes(String(p.status||'').toUpperCase()),late=!!deadline&&deadline<today&&!closed;const phone=String(p.telefone||'').trim(),digits=phone.replace(/[^+\d]/g,'');app.innerHTML='<div class="brand">📱 '+esc(p.empresa||'ACOMPANHAMENTO DA PRODUÇÃO')+'</div><div class="os">OS '+esc(p.os||'—')+'</div><div class="status '+(late?'late':'')+'">'+(late?'ATRASADO · ':'')+esc(p.status||'EM PRODUÇÃO')+'</div><div class="grid"><div class="item"><small>Cliente</small><b>'+esc(p.cliente||'—')+'</b></div><div class="item '+(late?'late':'')+'"><small>Prazo</small><b>'+esc(fmt(p.prazo))+(late?' · VENCIDO':'')+'</b></div><div class="item"><small>Contato</small><b>'+(phone?'<a href="tel:'+esc(digits)+'">'+esc(phone)+'</a>':'Não informado')+'</b></div><div class="item"><small>Data de entrada</small><b>'+esc(fmt(p.entrada))+'</b></div><div class="item"><small>Setor atual</small><b>'+esc(p.setor||'—')+'</b></div><div class="item"><small>Quantidade</small><b>'+esc(p.quantidade||0)+' unidade(s)</b></div>'+(p.horaMarcada?'<div class="item"><small>Horário marcado</small><b>'+esc(p.horaMarcada)+'</b></div>':'')+'</div><div class="section"><h3>📦 Pedido</h3><div class="produto">'+esc(p.pedido||'Demanda sem descrição')+'</div>'+itens.map(x=>'<div class="produto"><b>'+esc(x.quantidade||1)+'× '+esc(x.descricao||x.tipo||'Item')+'</b>'+(x.tipo?'<small style="display:block;color:#64748b;margin-top:4px">'+esc(x.tipo)+'</small>':'')+'</div>').join('')+'</div>'+(late?'<div class="alert">⚠️ Esta OS está atrasada. A equipe está trabalhando para concluir a produção.</div>':(p.bloqueado||p.pendencia?'<div class="alert">⚠️ Existe uma pendência em andamento. A equipe está trabalhando para regularizar.</div>':''))+'<div class="ok">Última atualização: '+(p.atualizado_em?new Date(p.atualizado_em).toLocaleString('pt-BR'):'—')+'<br>Esta página atualiza automaticamente.</div>'}
async function load(){if(!token){app.innerHTML='<div class="erro">Link de acompanhamento inválido.</div>';return}try{const r=await fetch('https://ugqxcarzyjmybyrpdrqx.supabase.co/functions/v1/producao-vip-app/api/public/'+encodeURIComponent(token),{cache:'no-store'}),j=await r.json();if(!r.ok||!j.ok)throw Error(j.error||'Acompanhamento não encontrado');render(j.pedido)}catch(e){app.innerHTML='<div class="erro">Não foi possível carregar este acompanhamento.<br><br>'+esc(e.message)+'</div>'}}
load();setInterval(load,5000);
</script></body></html>
